<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QRDrop</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#f5f6f8;color:#333}
.card{background:#fff;border-radius:12px;padding:2rem;max-width:22rem;margin:1rem;box-shadow:0 2px 8px rgba(0,0,0,.08);text-align:center}
h1{font-size:1.1rem;margin:0 0 .5rem}
p{margin:0;line-height:1.7}
</style>
</head>
<body>
<div class="card">
<h1>{{.Status}} — アクセスできません</h1>
<p>{{.Message}}</p>
</div>
</body>
</html>
